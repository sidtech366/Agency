<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SidTech App</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Yahan se overflow: hidden hata diya hai taaki conflict na ho */
      background-color: #f4f4f4;
    }
    
    /* Scroll ko smooth banane ke liye naya container */
    .scroll-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto; /* Scrolling ON */
      -webkit-overflow-scrolling: touch; /* Mobile me smooth scroll ke liye zaroori */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Wrapper ke andar iframe dala hai -->
  <div class="scroll-wrapper">
    <iframe 
      src="https://sidtech1.ai.studio" 
      allowfullscreen="true"
      scrolling="yes">
    </iframe>
  </div>

</body>
</html>
