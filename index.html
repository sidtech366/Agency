<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Default Mobile View -->
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SidTech App</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Jab drag chal raha ho tabhi iframe click hona band ho, baaki time normal rahe */
    body.is-dragging iframe {
      pointer-events: none;
    }

    /* Floating Draggable Icon */
    #draggable-btn {
      position: absolute;
      width: 60px;  
      height: 60px; 
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px; 
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      cursor: grab;
      z-index: 10000;
      user-select: none;
      touch-action: none; 
    }
    
    #draggable-btn:active {
      cursor: grabbing;
      background: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>

  <iframe 
    id="main-frame"
    src="https://sidtech1.ai.studio"
    allowfullscreen="true">
  </iframe>

  <!-- Button for switching views -->
  <div id="draggable-btn">💻</div>

  <script>
    // --- View Toggle Logic ---
    let isDesktop = false; 
    const meta = document.getElementById('viewport-meta');
    const btn = document.getElementById('draggable-btn');

    function toggleView() {
      if (!isDesktop) {
        meta.setAttribute('content', 'width=1024');
        btn.innerHTML = '📱'; 
        isDesktop = true;
      } else {
        meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        btn.innerHTML = '💻'; 
        isDesktop = false;
      }
    }

    // --- Drag and Drop Logic ---
    let isDragging = false;
    let hasMoved = false; 
    let startX, startY, initialLeft, initialTop;

    // Default Starting Position
    btn.style.left = (window.innerWidth - 80) + 'px';
    btn.style.top = (window.innerHeight - 80) + 'px';

    function onDragStart(e) {
      isDragging = true;
      hasMoved = false;
      
      startX = e.clientX || (e.touches && e.touches[0].clientX);
      startY = e.clientY || (e.touches && e.touches[0].clientY);
      
      initialLeft = btn.offsetLeft;
      initialTop = btn.offsetTop;
      
      document.body.classList.add('is-dragging'); 
    }

    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault(); 

      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      
      const dx = clientX - startX;
      const dy = clientY - startY;

      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        hasMoved = true;
      }

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - btn.offsetWidth));
      newTop = Math.max(0, Math.min(newTop, window.innerHeight - btn.offsetHeight));

      btn.style.left = newLeft + 'px';
      btn.style.top = newTop + 'px';
    }

    function onDragEnd(e) {
      if (!isDragging) return;
      isDragging = false;
      document.body.classList.remove('is-dragging');

      // Sirf tap karne par change ho, touch cancel ya window blur hone par nahi
      if (!hasMoved && (e.type === 'mouseup' || e.type === 'touchend')) {
        toggleView();
      }
    }

    // PC Mouse Events
    btn.addEventListener('mousedown', onDragStart);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('mouseleave', onDragEnd); // Galti se bahar jane par freeze roko

    // Mobile Touch Events
    btn.addEventListener('touchstart', onDragStart, { passive: false });
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend', onDragEnd);
    document.addEventListener('touchcancel', onDragEnd); // FREEZE FIX: Mobile notification ya call aane par

    // Extra Security: Browser app change hone par reset karo
    window.addEventListener('blur', onDragEnd); 

    // Window resize par bahar jaane se roko
    window.addEventListener('resize', () => {
      let currentLeft = parseInt(btn.style.left || 0);
      let currentTop = parseInt(btn.style.top || 0);
      
      if (currentLeft > window.innerWidth - btn.offsetWidth) {
        btn.style.left = (window.innerWidth - btn.offsetWidth - 10) + 'px';
      }
      if (currentTop > window.innerHeight - btn.offsetHeight) {
        btn.style.top = (window.innerHeight - btn.offsetHeight - 10) + 'px';
      }
    });
  </script>

</body>
</html>
